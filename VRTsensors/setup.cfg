[metadata]
name = VRTsensors
author = Fabrizio De Fiore
author_email = fabriziodefiore.work@gmail.com
description = Physiological sensor acquisition for VRTstatistics
long_description = file: readme.md
long_description_content_type = text/markdown
url = https://github.com/cwi-dis/VRTstatistics
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.12
install_requires =
	VRTstatistics
	numpy
	pyserial
	pylsl

[options.entry_points]
console_scripts =
	VRTsensors-bitalino = VRTsensors.bitalino:main
	VRTsensors-emotibit = VRTsensors.emotibit:main
	VRTsensors-validate = VRTsensors.validate:main

[options.packages.find]
where = src

[tool:setuptools_scm]
search_parent_directories = true
fallback_version = 0.0.0.dev0
